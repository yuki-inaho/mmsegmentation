# cu128 dev/runtime environment for this mmsegmentation fork.
#
# uv *virtual* project (not itself a package). `uv sync` provisions the validated
# cu128 stack (torch 2.8.0+cu128, mmcv 2.2.0 self-hosted cu128 wheel, mmengine 0.10.x,
# numpy<2) plus mmseg's runtime deps. `just sync` then puts this pure-Python mmseg
# source on the venv path via a .pth file (develop-style).
[project]
name = "mmseg-cu128-devenv"
version = "0.0.0"
description = "cu128 (torch 2.8.0 + cu128) dev/runtime env for the mmsegmentation fork"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy<2",
    "mmcv==2.2.0",
    "mmengine>=0.10,<1.0",
    "setuptools<81",
    "wheel",
    # mmseg runtime deps (requirements/runtime.txt):
    "matplotlib",
    "packaging",
    "prettytable",
    "scipy",
    # required by mmseg CLIP-derived text imports (confirmed in sandbox validation):
    "ftfy",
    "regex",
]

[tool.uv]
package = false

[tool.uv.sources]
mmcv = { url = "https://github.com/yuki-inaho/mmcv/releases/download/cu128-wheels-v0.1/mmcv-2.2.0-0sm120t280-cp310-cp310-linux_x86_64.whl" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
